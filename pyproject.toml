[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-supply-chain-control-tower"
version = "1.0.0"
description = "Historical delivery intelligence and intervention scenario optimization"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=2,<3", "pyarrow>=18", "scikit-learn>=1.6,<2", "xgboost>=2.1,<4", "ortools>=9.11,<10", "psycopg[binary]>=3.2,<4", "dbt-postgres>=1.9,<2", "streamlit>=1.42,<2", "plotly>=6,<8", "joblib>=1.4", "requests>=2.32", "reportlab>=4", "matplotlib>=3.9", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "pytest>=8", "jsonschema>=4"]

[tool.setuptools.packages.find]
include = ["src*", "ingestion*"]

[project.optional-dependencies]
demo = ["imageio-ffmpeg>=0.6", "pillow>=11", "playwright>=1.50"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

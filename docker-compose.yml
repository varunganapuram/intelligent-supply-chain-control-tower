services:
  warehouse:
    image: postgres:17
    environment:
      POSTGRES_USER: ${PGUSER:-control_tower}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:-control_tower}
    ports:
      - "127.0.0.1:${PGPORT:-55432}:5432"
    volumes:
      - warehouse:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 12
volumes:
  warehouse:

name: Validate control tower
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 1 * *'
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: control_tower
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: control_tower
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U control_tower -d control_tower"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: control_tower
      PGUSER: control_tower
      PGPASSWORD: ephemeral_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest tests/test_decisions.py -q
      - run: python -m src.pipeline
      - run: python scripts/verify_handoff.py
      - run: python -m pytest -q
      - run: python scripts/export_powerbi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            reports/
            artifacts/
